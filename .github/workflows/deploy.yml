name: Deploy site

# Rebuilds the project cards from the public cocan-dev repos and deploys to
# GitHub Pages. Nothing is committed back; the repo history stays clean.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly, picks up commits to other projects
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh project cards
        run: python3 scripts/update_activity.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the privacy promises
        run: python3 scripts/check_claims.py --live https://cocan.dev/
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html 404.html privacy.html style.css favicon.svg apple-touch-icon.png social-v2.png robots.txt CNAME _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
